<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cancionero Meribá</title>
<meta name="description" content="Cancionero Meribá con acordes y transposición de tono">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <button class="icon-btn only-mobile" id="backBtn" aria-label="Volver al índice" hidden>←</button>
  <a class="brand" href="#">Cancionero <strong>Meribá</strong></a>
  <div class="top-actions">
    <button class="pill" id="notationBtn" title="Cambiar notación">DO · C</button>
    <button class="icon-btn" id="themeBtn" aria-label="Cambiar tema">☾</button>
  </div>
</header>
<nav class="chipbar" aria-label="Categorías"><div class="chips" id="chips"></div></nav>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="search-wrap">
      <input type="search" id="search" placeholder="Buscar canción o letra…" autocomplete="off">
    </div>
    <ol class="song-list" id="songList"></ol>
  </aside>

  <main class="content" id="content">
    <section class="welcome" id="welcome">
      <h1>Cancionero Meribá</h1>
      <p>Elige una canción del índice. Con el controlador de tono puedes subir o bajar la canción y todos los acordes se transponen automáticamente.</p>
      <p class="muted" id="count"></p>
    </section>

    <article class="song" id="song" hidden>
      <div class="song-head">
        <span class="code" id="songCode"></span>
        <div class="title-row">
          <h1 id="songTitle"></h1>
          <button class="edit-btn" id="editBtn" title="Editar la canción: letra, acordes y párrafos" aria-label="Editar canción">✎ Editar</button>
        </div>
        <div class="tags" id="songTags"></div>
      </div>

      <div class="variants" id="variants" hidden></div>

      <pre class="sheet" id="sheet"></pre>

      <nav class="pager">
        <a id="prevLink" href="#">← Anterior</a>
        <a id="nextLink" href="#">Siguiente →</a>
      </nav>
    </article>
  </main>
</div>

<nav class="toolbar" id="toolbar" aria-label="Controles de la canción" hidden>
  <button class="tb gear" id="gearBtn" aria-expanded="true" aria-controls="tbItems" aria-label="Contraer o expandir el menú" title="Mostrar u ocultar controles">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.35a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.54 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.26.6.85 1 1.51 1.03H21a2 2 0 1 1 0 4h-.09c-.66.03-1.25.43-1.51 1.03z"/></svg>
  </button>
  <div class="tb-items" id="tbItems">
  <button class="tb" id="upBtn" aria-label="Subir medio tono" title="Subir medio tono">+</button>
  <label class="tb key" title="Elegir tono">
    <span class="key-name" id="keyName"></span>
    <span class="key-off" id="offset"></span>
    <select id="keySelect" aria-label="Elegir tono"></select>
  </label>
  <button class="tb" id="downBtn" aria-label="Bajar medio tono" title="Bajar medio tono">−</button>
  <button class="tb small" id="resetBtn" aria-label="Volver al tono original" title="Tono original">↺</button>
  <span class="tb-sep"></span>
  <button class="tb" id="fontUp" aria-label="Letra más grande" title="Letra más grande">A<sup>+</sup></button>
  <button class="tb" id="fontDown" aria-label="Letra más pequeña" title="Letra más pequeña">A<sup>−</sup></button>
  <span class="tb-sep"></span>
  <button class="tb small" id="lyricsOnly" aria-pressed="false" title="Mostrar solo la letra">Solo<br>letra</button>
  <button class="tb small" id="monoFont" aria-pressed="false" title="Fuente de ancho fijo">Mono</button>
  <span class="tb-sep"></span>
  <button class="tb small screen-btn" id="screenBtn" title="Modo Pantalla: solo la letra, blanca sobre negro">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>
    Pantalla
  </button>
  </div>
</nav>

<script src="songs.js"></script>
<script src="chords.js"></script>
<script src="app.js"></script>
<script src="live.js"></script>
<script src="screen.js"></script>
<script src="editor.js"></script>
</body>
</html>
